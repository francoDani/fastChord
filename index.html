<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Cancionero Pro</title>
    <link rel="stylesheet" href="css/styles.css?v=20260824-3">
</head>

<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <header class="sidebar-header">
                <div class="sidebar-brand-row">
                    <h1>Fast Chord</h1>
                    <button id="btn-auth" class="btn btn-icon" title="Iniciar sesión">♙</button>
                </div>
                <div class="sidebar-header-controls">
                    <span id="auth-user" class="auth-user"></span>
                    <details id="editor-actions" class="actions-menu">
                        <summary title="Acciones editoriales">+</summary>
                        <div id="actions-menu-content" class="actions-menu-content">
                            <button id="btn-new" class="btn btn-primary" title="Nueva canción">Nueva canción</button>
                            <button id="btn-new-playlist" class="btn btn-playlist" title="Nueva playlist">Nueva playlist</button>
                            <button id="btn-export-json" class="btn" title="Exportar JSON">Exportar JSON</button>
                            <button id="btn-import-json" class="btn" title="Importar JSON">Importar JSON</button>
                            <button id="btn-export-txt" class="btn" title="Exportar .txt">Exportar TXT</button>
                            <button id="btn-import-txt" class="btn" title="Importar .txt / OnSong">Importar TXT</button>
                            <input type="file" id="import-json-file" accept=".json" hidden>
                            <input type="file" id="import-txt-files" accept=".txt,.cho,.crd,.chordpro,.onsong" multiple hidden>
                        </div>
                    </details>
                </div>
            </header>
            <div class="search-box">
                <input type="search" id="search-input" placeholder="Buscar título o artista..." autocomplete="off">
            </div>

            <div class="filter-box">
                <select id="category-filter">
                    <option value="">Todas las categorías</option>
                </select>
            </div>

            <section id="playlists-panel" class="playlists-panel hidden">
                <div class="playlists-heading">
                    <h2>Playlists</h2>
                </div>
                <ul id="playlist-list" class="playlist-list"></ul>
            </section>

            <ul id="song-list" class="song-list"></ul>
        </aside>

        <!-- Workspace -->
        <main id="workspace">
            <button id="btn-toggle-sidebar" title="Mostrar/Ocultar lista">☰</button>

            <div id="empty-state" class="empty-state">
                <p>Selecciona una canción o crea una nueva</p>
            </div>

            <div id="song-view" class="hidden">
                <header class="song-header">
                    <div class="song-meta">
                        <h2 id="song-title"></h2>
                        <p id="song-artist"></p>
                        <span id="song-category" class="badge"></span>
                    </div>
                    <div class="song-controls">
                        <button id="btn-edit" class="btn btn-icon" title="Editar">✏️</button>
                        <button id="btn-delete" class="btn btn-danger btn-icon" title="Eliminar">🗑️</button>
                        <div class="transpose-controls compact">
                            <button id="btn-transpose-down" class="btn">−</button>
                            <span id="transpose-value">0</span>
                            <button id="btn-transpose-up" class="btn">+</button>
                        </div>
                        <button id="btn-autoscroll" class="btn btn-icon" title="Auto-scroll">▶</button>
                        <button id="btn-toggle-chords" class="btn btn-icon" title="Ocultar/Mostrar acordes">🎸</button>
                        <a id="btn-youtube" class="btn btn-icon" target="_blank" rel="noopener" style="display:none;"
                            title="YouTube">📺</a>
                    </div>
                </header>

                <div id="chord-display" class="chord-display"></div>

                <section class="notes-section">
                    <div class="notes-header">
                        <h3>Notas personales</h3>
                        <button id="btn-save-notes" class="btn btn-primary" title="Guardar notas">Guardar notas</button>
                    </div>
                    <textarea id="song-notes" placeholder="Anotaciones..."></textarea>
                </section>
            </div>

            <!-- Formulario -->
            <div id="song-form" class="hidden">
                <h2 id="form-title">Nueva canción</h2>
                <form id="form-song">
                    <label>Título
                        <input type="text" id="form-title-input" required>
                    </label>
                    <label>Artista
                        <input type="text" id="form-artist">
                    </label>
                    <label>Categoría
                        <details id="category-dropdown" class="category-dropdown">
                            <summary id="category-summary">Seleccionar categorías</summary>
                            <div id="category-options" class="category-options">
                                <label><input type="checkbox" value="Entrada">Entrada</label>
                                <label><input type="checkbox" value="Perdon">Perdón</label>
                                <label><input type="checkbox" value="Gloria">Gloria</label>
                                <label><input type="checkbox" value="Aleluya">Aleluya</label>
                                <label><input type="checkbox" value="Ofertorio">Ofertorio</label>
                                <label><input type="checkbox" value="Santo">Santo</label>
                                <label><input type="checkbox" value="Cordero">Cordero</label>
                                <label><input type="checkbox" value="Comunion">Comunión</label>
                                <label><input type="checkbox" value="Meditacion">Meditación</label>
                                <label><input type="checkbox" value="Salida">Salida</label>
                                <label><input type="checkbox" value="Mariana">Mariana</label>
                            </div>
                        </details>
                        <input type="hidden" id="form-category">
                    </label>
                    <label>Enlace YouTube (opcional)
                        <input type="url" id="form-youtube" placeholder="https://youtube.com/...">
                    </label>
                    <label>Letra + Acordes (formato ChordPro / OnSong)
                        <textarea id="form-body" rows="18" placeholder="[C]Hola [G]mundo"></textarea>
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <button type="button" id="btn-cancel" class="btn">Cancelar</button>
                    </div>
                </form>
            </div>

            <div id="playlist-form" class="hidden playlist-form">
                <h2>Nueva playlist</h2>
                <form id="form-playlist">
                    <label>Nombre de la playlist
                        <input type="text" id="playlist-name" required>
                    </label>
                    <div id="playlist-slots" class="playlist-slots"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-playlist">Crear playlist</button>
                        <button type="button" id="btn-cancel-playlist" class="btn">Cancelar</button>
                    </div>
                </form>
            </div>

            <section id="playlist-view" class="hidden playlist-view">
                <div class="playlist-view-header">
                    <button id="btn-back-playlists" class="btn" title="Volver a playlists">Volver</button>
                    <div>
                        <h2 id="playlist-view-title"></h2>
                        <p id="playlist-view-description"></p>
                    </div>
                </div>
                <ol id="playlist-song-list" class="playlist-song-list"></ol>
            </section>

            <section id="shared-playlist-view" class="hidden shared-playlist-view">
                <header class="shared-playlist-header">
                    <h1>FastChord</h1>
                    <h2 id="shared-playlist-title"></h2>
                    <p id="shared-playlist-description"></p>
                </header>
                <div class="shared-playlist-content">
                    <aside class="shared-song-sidebar">
                        <h3>Canciones</h3>
                        <ol id="shared-song-list" class="shared-song-list"></ol>
                    </aside>
                    <article id="shared-song-reader" class="shared-song-reader">
                        <h3 id="shared-song-title"></h3>
                        <div id="shared-chord-display" class="chord-display"></div>
                    </article>
                </div>
                <nav class="shared-song-navigation">
                    <button id="shared-prev" class="btn" type="button">Anterior</button>
                    <span id="shared-song-position"></span>
                    <button id="shared-next" class="btn" type="button">Siguiente</button>
                </nav>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=20260823"></script>
    <script src="js/auth.js?v=20260823"></script>
    <script src="js/migrate-songs.js?v=20260823"></script>
    <script src="js/playlists.js?v=20260824-2"></script>
    <script src="js/storage.js?v=20260823"></script>
    <script src="js/chordpro.js?v=20260823"></script>
    <script src="js/ui.js?v=20260824-3"></script>
    <script src="js/app.js?v=20260824-7"></script>
</body>

</html>
